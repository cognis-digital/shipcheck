[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-shipcheck"
version = "0.6.4"
description = "Offline Dockerfile linter with image-size hygiene and a bundled 262k-record OSV CVE database"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "devtools", "shipcheck"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/shipcheck"

[project.scripts]
"shipcheck-emit" = "shipcheck.connect:emit_main"
shipcheck = "shipcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["shipcheck"]
# Bundle the offline OSV corpus + edge-feed catalog inside the wheel so the
# tool works air-gapped the moment it is installed.
artifacts = [
    "shipcheck/cognis_vulndb.jsonl.gz",
    "shipcheck/data_feeds_2026.json",
]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "shipcheck/VERSION"

[tool.hatch.metadata]
allow-direct-references = true
